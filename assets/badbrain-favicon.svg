<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BADBRAIN Studios" fill="none">
  <!-- Signal‑red background -->
  <rect x="0" y="0" width="32" height="32" fill="#C41E3A" />

  <!-- Abstract editorial mark (scaled down bars) -->
  <g transform="translate(7 7) scale(0.85)" fill="#EEEBE4">
    <rect x="3" y="6" width="2" height="12"/>
    <rect x="7" y="6" width="10" height="2"/>
    <rect x="7" y="11" width="13" height="2"/>
    <rect x="7" y="16" width="10" height="2"/>
  </g>

  <!-- Corner pip (small black square with red outline) -->
  <rect x="25" y="1" width="6" height="6" fill="#0D0D0D" stroke="#C41E3A" stroke-width="1" />
</svg>
